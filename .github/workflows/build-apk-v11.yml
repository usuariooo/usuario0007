name: Build OddsWatch v1.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir OddsWatch
        run: | rm -rf OddsWatch-Mobile unzip -o OddsWatch-Mobile-1.1.zip 
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: OddsWatch-Mobile
        run: gradle assembleDebug

      - name: Preparar APK
        run: | APK="$(find OddsWatch-Mobile/app/build/outputs/apk -type f -name '*.apk' | head -n 1)" echo "APK encontrado: $APK" test -n "$APK" cp "$APK" OddsWatch.apk ls -lh OddsWatch.apk 
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: OddsWatch-Android
          path: OddsWatch.apk
          if-no-files-found: error
          retention-days: 7
